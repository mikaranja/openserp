services:
  openserp:
    init: true
    # Chrome crashes with "Out of memory" on page loads when /dev/shm is the default 64MB. Prefer an enlarged shm over `ipc:host` to keep the container isolated from the host IPC namespace.
    shm_size: 2gb
    # Built from this repo; config.yaml is baked into the image by the Dockerfile.
    build:
      context: .
    expose:
      - "7000"
    command: serve -l
    # proxies:
    #   entries:
    #     - url: http://user:pass@res-proxy-1.example:8080
    #       tags: [google]
    #     - url: http://user:pass@res-proxy-2.example:8080
    #       tags: [google]
    # google:
    #   proxy: google
    
    environment:
      OPENSERP_SERVER_HOST: "0.0.0.0"
      OPENSERP_SERVER_PORT: 7000
      # Proxy toggle: set USE_PROXY=true and PROXY_URL=http://user:pass@host:port (URL-encode special chars in the password). Proxy is ON when USE_PROXY is non-empty; to turn it OFF, empty or delete USE_PROXY (PROXY_URL can stay).
      OPENSERP_PROXIES_GLOBAL: "${USE_PROXY:+${PROXY_URL:-}}"
      OPENSERP_BAIDU_RATE_REQUESTS: 6   # Number of requests per Minute
      OPENSERP_BAIDU_RATE_BURST: 2      # Number of non-ratelimited requests per Minute
    
